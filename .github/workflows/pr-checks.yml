      - name: Run module synthesis
        shell: bash
        run: |
          set -euo pipefail
          settings_args=()
          if [ -n "${{ inputs.synthesis_settings }}" ]; then
            settings_args=(--settings "${{ inputs.synthesis_settings }}")
          fi
          if [ -f .ci/changed_files.txt ]; then
            settings_args+=(--changed-files .ci/changed_files.txt)
          fi
          python3 package/rtl-commons/synthesis/bin/run_synthesis_matrix.py \
            --project-root . \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${settings_args[@]}"

      - name: Upload synthesis logs and reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-logs
          retention-days: 7
          path: |
            design/rtl/*/pd_handoff/synthesis/*/logs_dc/
            design/rtl/*/pd_handoff/synthesis/*/reports/
          if-no-files-found: warn

  gate:
    name: Gate
    needs: [initial-checks, compile, lint, synthesis]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Finalize status
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.initial-checks.result }}" != "success" ]; then
            echo "Initial checks failed."
            exit 1
          fi
          if [ "${{ needs.compile.result }}" != "success" ]; then
            echo "One or more compile checks failed."
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "One or more lint or CDC checks failed."
            exit 1
          fi
          if [ "${{ needs.synthesis.result }}" != "success" ]; then
            echo "Sanity or synthesis checks failed."
            exit 1
          fi
          echo "Compile, coverage, lint, CDC, sanity and synthesis checks completed successfully."

  cleanup:
    name: Stop EC2 runner
    needs: [compile, lint, synthesis, provision]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        if: ${{ needs.provision.outputs.ec2_instance_id != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # GitHub can take a few seconds to release a runner after its last job.
      # Remove the runner before terminating its instance, and retry while it is
      # still marked busy.  This makes cleanup safe to retry as well.
      - name: Remove GitHub runner
        if: ${{ needs.provision.outputs.ec2_instance_id != '' }}
        shell: bash
        env:
          RUNNER_TOKEN: ${{ secrets.RUNNER_CFG_PAT }}
          RUNNER_LABEL: ${{ needs.provision.outputs.runner_label }}
        run: |
          set -euo pipefail
          runner_name="ec2-${RUNNER_LABEL}"

          for attempt in {1..18}; do
            runner="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${RUNNER_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
              | jq --arg name "$runner_name" '[.runners[] | select(.name == $name)] | first')"

            if [ "$runner" = "null" ]; then
              echo "Runner ${runner_name} is already removed."
              exit 0
            fi

            runner_id="$(jq -r '.id' <<<"$runner")"
            if [ "$(jq -r '.busy' <<<"$runner")" = "true" ]; then
              echo "Runner ${runner_name} is still busy (attempt ${attempt}/18)."
              sleep 5
              continue
            fi

            if curl --fail-with-body --silent --show-error --request DELETE \
              --header "Authorization: Bearer ${RUNNER_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/${runner_id}"; then
              echo "Removed GitHub runner ${runner_name}."
              exit 0
            fi

            echo "Runner removal was not accepted yet (attempt ${attempt}/18)."
            sleep 5
          done

          echo "Runner ${runner_name} did not become removable within 90 seconds."
          exit 1

      - name: Terminate EC2 runner
        if: ${{ needs.provision.outputs.ec2_instance_id != '' }}
        shell: bash
        env:
          EC2_INSTANCE_ID: ${{ needs.provision.outputs.ec2_instance_id }}
        run: |
          set -euo pipefail
          state="$(aws ec2 describe-instances --instance-ids "$EC2_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text 2>/dev/null || true)"

          if [ -z "$state" ] || [ "$state" = "None" ] || [ "$state" = "terminated" ]; then
            echo "EC2 instance ${EC2_INSTANCE_ID} is already gone."
            exit 0
          fi

          aws ec2 terminate-instances --instance-ids "$EC2_INSTANCE_ID" >/dev/null
          echo "Requested termination of EC2 instance ${EC2_INSTANCE_ID}."
