            design/rtl/**/code/cdc_run/
          if-no-files-found: warn
          include-hidden-files: true

  synthesis:
    name: Synthesis
    needs: [provision]
    runs-on: [self-hosted, "${{ needs.provision.outputs.runner_label }}"]
    steps:
      - name: Prepare synthesis checks
