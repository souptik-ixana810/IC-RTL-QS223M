            echo "VC_STATIC_HOME=${vc_static_home}"
            echo "ICV_HOME_DIR=/home/ec2-user/synopsys/icvalidator/W-2024.09-SP5"
            echo "SFT_ROOT=/home/ec2-user/synopsys/sft/W-2024.09-SP5-1"
            echo "LD_LIBRARY_PATH=/home/ec2-user/synopsys/sft/W-2024.09-SP5-1/plat/xlib/Linux4.x-x86_64:${LD_LIBRARY_PATH:-}"
            echo "SYNOPSYS_PRIMEWAVE_ENABLE_THIRDPARTY=1"
            echo "PRIMESIM=1"
            echo "PDK_INSTALL_PATH=/home/centos/pdk_files/65MSRFLP/PDK/TSMCiPDK/tn65cmsp007w1_1_7c"
