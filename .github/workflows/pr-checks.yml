          printf '%s\n' "${synopsys_paths[@]}" >> "$GITHUB_PATH"
          export PATH="$(IFS=:; echo "${synopsys_paths[*]}"):$PATH"
          command -v vc_static_shell || true
          command -v python3 || true

      - name: Discover and run lint checks
        shell: bash
        run: |
          set -euo pipefail
