          clean_origin_url="https://github.com/${GITHUB_REPOSITORY}.git"
          auth_origin_url="https://x-access-token:${CHECKOUT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          trap 'git remote set-url origin "$clean_origin_url" >/dev/null 2>&1 || true' EXIT
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$auth_origin_url"
          else
            git remote add origin "$auth_origin_url"
          fi
          git config --local filter.lfs.required false
          git config --local filter.lfs.smudge cat
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.process ""
          git fetch --no-tags --prune origin "+${GITHUB_REF}:refs/remotes/origin/ci-checkout"
          git checkout --force --detach refs/remotes/origin/ci-checkout
          git clean -ffdx

          git -c url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf="https://github.com/" \
              -c url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf="git@github.com:" \
              -c url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf="ssh://git@github.com/" \
              submodule update --init --recursive

          mkdir -p .ci
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > .ci/changed_files.txt
            echo "Changed files:"
            sed 's/^/  /' .ci/changed_files.txt
          fi
          git remote set-url origin "$clean_origin_url"

          vc_static_home=/home/ec2-user/synopsys/vc_static/X-2025.06-SP2-1
          echo "Using VC Static from ${vc_static_home}"

          synopsys_paths=(
