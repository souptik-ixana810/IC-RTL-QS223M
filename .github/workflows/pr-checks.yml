    name: Lint and CDC
    needs: [provision, compile]
    runs-on: [self-hosted, "${{ needs.provision.outputs.runner_label }}"]
    steps:
      - name: Prepare lint checks
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          SUBMODULE_TOKEN: ${{ secrets.RUNNER_CFG_PAT }}
        run: |
          set -euo pipefail

